<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PNGTuber</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <button id="startBtn">Start Avatar</button>

    <div id="avatar-frame">

    <div id="avatar-container">

    <!-- Body -->
    <img
        id="body"
        class="avatar"
        src="{{ url_for('static', filename='avatars/body.png') }}"
    >

    <!-- Head Group -->
    <div id="head-container">

        <img
            id="head"
            class="avatar"
            src="{{ url_for('static', filename='avatars/head.png') }}"
        >

        <img
    id="eyes"
    class="avatar"
    src="{{ url_for('static', filename='avatars/eyes.png') }}"
>

        <img
            id="beak"
            class="avatar"
            src="{{ url_for('static', filename='avatars/mouth-closed.png') }}"
        >

    </div>

</div>
    </div>
    </div>
    <script
    type="module"
    src="{{ url_for('static', filename='js/main.js') }}">
</script>

</body>
</html>
